name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      # The official Euro-Office release for this platform (about 0.5 to 1 GB), cached by manifest.
      - uses: actions/cache@v4
        with:
          path: .vendor-cache
          key: euro-office-${{ runner.os }}-${{ hashFiles('scripts/euro-office.manifest.json') }}
      - name: Vendor Euro-Office (the editor tests check the error path when this fails)
        continue-on-error: true
        run: npm run vendor
      # Ubuntu 24.04 blocks the unprivileged user namespaces that the Chromium sandbox uses.
      - name: Allow the Electron sandbox on Linux
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test
      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
