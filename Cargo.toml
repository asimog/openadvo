[workspace]
resolver = "2"
members = [
    "crates/oa-types",
    "crates/oa-session",
    "crates/oa-harness",
    "crates/oa-capture",
    "crates/oa-ocr",
    "crates/oa-notebook",
    "crates/oa-docs",
    "crates/oa-browser",
    "crates/oa-verify",
    "crates/oa-store",
    "crates/oa-kernel",
    "crates/oa-protocol",
    "crates/oa-control",
    "crates/oa-client",
    "crates/oa-cli",
    "crates/oa-shell",
    "crates/oa-repo-checks",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
oa-types = { path = "crates/oa-types" }
oa-session = { path = "crates/oa-session" }
oa-harness = { path = "crates/oa-harness" }
oa-capture = { path = "crates/oa-capture" }
oa-ocr = { path = "crates/oa-ocr" }
oa-notebook = { path = "crates/oa-notebook" }
oa-docs = { path = "crates/oa-docs" }
oa-browser = { path = "crates/oa-browser" }
oa-verify = { path = "crates/oa-verify" }
oa-store = { path = "crates/oa-store" }
oa-kernel = { path = "crates/oa-kernel" }
oa-client = { path = "crates/oa-client" }
oa-protocol = { path = "crates/oa-protocol" }
oa-control = { path = "crates/oa-control" }
base64 = "0.22"
schemars = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Threading"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.31", features = ["wgpu"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
ulid = "1"
unicode-normalization = "0.1"
