[package]
name = "oa-shell"
description = "The window (spec A): egui and winit, our panes, a client of the control pipe"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "oa_shell"
path = "src/lib.rs"

[[bin]]
name = "oa-shell"
path = "src/main.rs"

[dependencies]
oa-types.workspace = true
oa-protocol.workspace = true
oa-firm.workspace = true
oa-client.workspace = true
eframe.workspace = true
image.workspace = true
serde_json.workspace = true
chrono.workspace = true
base64.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.31.1", features = ["wgpu", "snapshot"] }
tempfile.workspace = true
